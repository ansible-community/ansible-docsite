[project]
name = "ansible-docsite"
version = "0.0.0"
description = "Ansible community docsite that provides landing pages for docs.ansible.com."
requires-python = ">=3.13"

[dependency-groups]
lint = ["djlint==1.49.10"]

[tool.djlint]
files=["./templates/","./themes/ansible-community/templates/"]
extension=".tmpl"
profile="jinja"
indent=2
ignore="J018"

---
name: nox

"on":
    workflow_call:

jobs:
    nox:
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            include:
              - session: lint
                python-versions: "3.13"
              - session: format
                python-versions: "3.13"
              - session: spelling
                python-versions: "3.13"
              - session: build
                python-versions: "3.13"
        name: "Run nox ${{ matrix.session }} session"
        steps:
          - name: Check out repo
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false
          - name: Setup uv
            uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
            with:
              enable-cache: true
              cache-suffix: "${{ matrix.session }}"
          - name: Setup nox
            uses: wntrblm/nox@afa3983bbac3143bab5c8406244327581f76a3d7 # 2026.10.20
            with:
              python-versions: "${{ matrix.python-versions }}"
          - name: "Run nox -s ${{ matrix.session }}"
            run: |
              nox -s "${{ matrix.session }}"
